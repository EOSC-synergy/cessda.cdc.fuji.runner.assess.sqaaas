config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cessda/cessda.cdc.fuji.runner:
      branch: main
      repo: https://github.com/cessda/cessda.cdc.fuji.runner
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cessda/cessda.cdc.fuji.runner git:
        commands:
        - /usr/bin/env sh .sqa/script.snow_wise_whale.sh
        container: qc.acc_cinnabar_brilliant_marmoset
  QC.Doc:
    repos:
      github.com/cessda/cessda.cdc.fuji.runner find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.raspberry_confused_wombat.sh
        container: qc.doc_jet_authentic_panther
      github.com/cessda/cessda.cdc.fuji.runner git:
        commands:
        - /usr/bin/env sh .sqa/script.arctic_vigilant_frog.sh
        container: qc.doc_ruby_enigmatic_jellyfish
      github.com/cessda/cessda.cdc.fuji.runner markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.tangerine_brave_hyena.sh
        container: qc.doc_dawn_savvy_echidna
  QC.Lic:
    repos:
      github.com/cessda/cessda.cdc.fuji.runner licensee:
        commands:
        - /usr/bin/env sh .sqa/script.storm_creative_owl.sh
        container: qc.lic_butterscotch_insightful_sparrow
  QC.Met:
    repos:
      github.com/cessda/cessda.cdc.fuji.runner cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.smoke_proud_stingray.sh
        container: qc.met_lavender_confident_hornbill
  QC.Sty:
    repos:
      github.com/cessda/cessda.cdc.fuji.runner jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.violet_shrewd_opossum.sh
        container: qc.sty_cornflower_passionate_manatee
  QC.Ver:
    repos:
      github.com/cessda/cessda.cdc.fuji.runner get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.persimmon_innocent_finch.sh
        container: qc.ver_maroon_eccentric_peacock
timeout: 5400
